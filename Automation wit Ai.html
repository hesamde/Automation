<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دستیار جلسه‌ی اتوماسیون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#36363B;font-family:'Vazirmatn',sans-serif;color:#F3F1EB;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:440px;width:100%;text-align:center}
  .logo{width:56px;height:56px;border-radius:16px;background:#1FA37D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px}
  h1{font-size:24px;font-weight:600;margin-bottom:8px}
  p{font-size:14px;color:#B6B2AA;line-height:1.8;margin-bottom:30px}
  .btns{display:flex;flex-direction:column;gap:12px}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;background:#141416;border:1px solid #2C2C31;border-radius:14px;padding:18px 20px;color:#F3F1EB;transition:border-color .15s,transform .1s}
  a.card:hover{border-color:#1FA37D;transform:translateY(-1px)}
  .flag{width:40px;height:40px;border-radius:10px;background:#15332B;color:#74D8B6;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .t{text-align:right;flex:1}
  .t b{font-size:16px;font-weight:600;display:block}
  .t span{font-size:12.5px;color:#888279}
  .arrow{color:#888279;font-size:18px}
  footer{margin-top:28px;font-size:11.5px;color:#888279;line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">⚙</div>
    <h1>دستیار جلسه‌ی اتوماسیون</h1>
    <p>ابزار کشف نیاز مشتری و تخمین صرفه‌جویی زمان و هزینه. نسخه‌ی موردنظر را انتخاب کن.</p>
    <div class="btns">
      <a class="card" href="automation-fa.html">
        <div class="flag">🇮🇷</div>
        <div class="t"><b>نسخه‌ی فارسی</b><span>راست‌چین · Farsi</span></div>
        <div class="arrow">←</div>
      </a>
      <a class="card" href="automation-de.html">
        <div class="flag">🇩🇪</div>
        <div class="t"><b>Deutsche Version</b><span>چپ‌چین · Deutsch</span></div>
        <div class="arrow">←</div>
      </a>
    </div>
    <footer>کاملاً آفلاین · بدون ارسال داده · ساخته‌شده برای جلسات مشاوره</footer>
  </div>
</body>
</html>
